# VirtualHost de producción — Symfony en /public
# El puerto real se reescribe en tiempo de arranque por entrypoint.sh
# usando la variable $PORT que inyecta Render.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # Propaga las variables de entorno del contenedor (Render) a $_SERVER de
    # PHP. Sin esto, Symfony no ve APP_ENV=prod ni MONGODB_URL en runtime y
    # Dotenv::bootEnv() vuelve a caer en los defaults de .env (APP_ENV=dev).
    PassEnv APP_ENV APP_DEBUG APP_SECRET
    PassEnv MONGODB_URL MONGODB_DB
    PassEnv MAILER_DSN MAIL_SENDER DEFAULT_URI
    PassEnv MOSTRAR_CAPTCHA MOSTRAR_NOTIFICACION_PREGUNTAS_SEGURIDAD

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Evita exponer /var, /vendor, etc.
    <DirectoryMatch "^/var/www/html/(var|vendor|config|src|templates|translations|scripts)">
        Require all denied
    </DirectoryMatch>

    # Cabeceras de seguridad básicas
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "SAMEORIGIN"
        Header set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
