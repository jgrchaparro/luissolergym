parameters:
    env(MONGODB_URI): ''
    env(MONGODB_DB): ''
    config_dir: '%kernel.project_dir%/config/packages/concilia'


services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Document/'
            - '../src/Kernel.php'

    # Configuración para usar MongoDB en NucleosUserBundle
    nucleos_user.object_manager:
        alias: doctrine_mongodb.odm.default_document_manager
        public: true

    App\EventListener\UserCanonicalFieldsListener:
        tags:
            - { name: doctrine_mongodb.odm.event_listener, event: prePersist }
            - { name: doctrine_mongodb.odm.event_listener, event: preUpdate }
