security:
    password_hashers:
        Nucleos\UserBundle\Model\UserInterface: 'auto'

    providers:
        nucleos_userbundle:
            id: nucleos_user.user_provider.username

    firewalls:
        main:
            pattern: ^/
            lazy: true
            stateless: false   # 🔑 Asegura que el token se guarde en sesión
            provider: nucleos_userbundle
            user_checker: Nucleos\UserBundle\Security\UserChecker

            form_login:
                provider: nucleos_userbundle
                login_path: nucleos_user_security_login
                check_path: nucleos_user_security_check
                default_target_path: /dashboard
                success_handler: App\Security\Handler\LoginSuccessHandler
                failure_handler: App\Security\Handler\LoginFailureHandler

            logout:
                path: nucleos_user_security_logout
                target: /

    access_control:
        - { path: ^/login$, role: PUBLIC_ACCESS }
        - { path: ^/dashboard, role: IS_AUTHENTICATED_FULLY }   # 🔑 Protege el dashboard
