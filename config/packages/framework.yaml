framework:
    secret: '%env(APP_SECRET)%'
    # Habilitar y configurar la sesión
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
        enabled: true
    # ... otras configuraciones

    # Configuración de Formularios
    form:
        csrf_protection:
            token_id: submit
